<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>YouShop</title>
  </head>
  <body>
    <div class="container">
      <!--=====================================
      ================ Header =================
      ======================================-->
      <header class="header">
        <div class="header__top">
          <div class="logo">
            <a href="/" class="logo__link">
              <h1 class="logo__title">
                <span class="logo__highlight">YOU</span>SHOP
              </h1>
              <p class="logo__description">Description</p>
            </a>
          </div>

          <div class="search-bar">
            <input
              type="text"
              class="search-bar__input"
              placeholder="Search products..."
            />
            <button class="search-bar__button">
              <i class="fas fa-search search-bar__icon"></i>
            </button>
          </div>

          <p class="header__hours">7 days a week from 8:00 am to 5:00 pm</p>

          <div class="wishlist">
            <i class="fas fa-heart wishlist__icon"></i>
            <span class="wishlist__count">13</span>
          </div>

          <div class="cart">
            ff6b35
            <div class="cart__icon-wrapper">
              <i class="fas fa-shopping-cart cart__icon"></i>
              <span class="cart__badge">0</span>
            </div>
            <div class="cart__info">
              <p class="cart__label">My cart</p>
              <p class="cart__total">0.00$</p>
            </div>
          </div>
        </div>

        <nav class="navigation">
          <div class="categories">
            <div class="categories__header">
              <i class="fas fa-bars categories__icon"></i>
              <span class="categories__title">All Categories</span>
            </div>
            <div class="categories__list">
              <a href="#" class="categories__item">Apple</a>
              <a href="#" class="categories__item">Samsung</a>
              <a href="#" class="categories__item">Meiza</a>
              <a href="#" class="categories__item">Xiaomi</a>
              <a href="#" class="categories__item">Honor</a>
              <a href="#" class="categories__item">Huawei</a>
              <a href="#" class="categories__item">Asus</a>
              <a href="#" class="categories__item">Nokia</a>
              <a href="#" class="categories__item">Motorola</a>
              <a href="#" class="categories__item">Caterpillar</a>
            </div>
          </div>
        </nav>
      </header>
    </div>
  </body>
</html>
